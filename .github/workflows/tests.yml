# The test suite, actually running in CI.
#
# It never has. Until this file, CI consisted of secret-scan.yml alone -
# gitleaks and the no-client-data guard - so "CI green" on roughly ten pull
# requests meant "no secrets leaked" and nothing whatever about the 407 backend
# and 89 frontend tests. A failing test could be, and was, committed and
# merged.
#
# That is the same shape as the five entries in docs/status-honesty-audit.md
# under "The verification that verified nothing": a check reported as passing
# that never examined the thing in question.
#
# Model weights are gitignored, so the backend suite needs them staged. Without
# them most tests do not fail - they SKIP, or the tokenizer raises and a whole
# file errors out - which is why fetch_models.py exits non-zero on a partial
# staging rather than letting a half-armed suite report success.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install huggingface_hub ruff==0.16.6

      - name: Lint backend for correctness errors
        run: python -m ruff check backend/app backend/tests --select E9,F63,F7,F82

      # ~400 MB. Cached on the requirements hash rather than on a date, so a
      # dependency bump re-fetches and an unchanged tree does not.
      - name: Cache models
        id: models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Stage models
        run: python scripts/fetch_models.py

      # Proves the suite is armed before it is trusted. Without the models most
      # of it skips, and a skipped suite reports success.
      - name: Confirm the models are staged
        run: python scripts/fetch_models.py --verify-only

      - name: Run the suite
        working-directory: backend
        run: python -m pytest -q --durations=10

  frontend:
    name: frontend (vitest + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `tsc -b`, NOT `tsc --noEmit -p tsconfig.json`. The latter checks ZERO
      # files here, because tsconfig.json is a solution file with "files": []
      # and project references - see the honesty audit.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run the suite
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npx vite build

      - name: Check initial bundle budget
        working-directory: frontend
        run: npm run check:budget

  accessibility:
    name: accessibility (axe serious/critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Restore the staged model bundle
        id: models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Confirm the staged model bundle
        if: steps.models.outputs.cache-hit == 'true'
        run: python scripts/fetch_models.py --verify-only

      - name: Stage models when the cache is cold
        if: steps.models.outputs.cache-hit != 'true'
        run: python scripts/fetch_models.py

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the browser used by the axe audit
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the local application
        env:
          AUTH_MODE: disabled
        run: |
          python backend/run.py > backend.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null && curl --fail --silent http://127.0.0.1:5173 >/dev/null && break
            sleep 2
          done

      - name: Run the full serious/critical axe gate
        working-directory: frontend
        env:
          CONTRAST_OUTPUT: contrast-ci.json
        run: npx playwright test tests/e2e/contrast-root-cause.spec.ts --config=playwright.phase0.config.ts
