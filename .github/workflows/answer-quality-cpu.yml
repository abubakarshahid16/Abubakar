# Answer-quality test of the prompt variants on GitHub's CPU machines (order 189).
#
# Asks the INVENTED P1 questions (`eval/p1ai/questions.json`, the invented corpus
# of `eval/p1/corpus.py`) through the real chat with each prompt variant of
# `backend/app/answer_prompts.py`, scores them with `eval/answer_quality/` (code
# checks only) and posts the table on the tracking issue. Scores count, TIMINGS
# DO NOT (speed is measured on the Mac).
#
# Rules, enforced in code, not by this file's wording:
#   * `workflow_dispatch` only: started by hand, never on a push or a schedule.
#   * Invented text only: `run_aq.py` builds its own throwaway database from
#     the in-repo invented corpus; no real document, standard or datasheet can
#     reach it, and no file is read from outside the repository.
#   * No secret is used: only the default token, and only to post the table
#     (`issues: write`). No Claude / API call (REASONING_PROVIDER is ollama).
#   * One run at a time (`concurrency`, never cancelled); 340 minutes at most.
#   * The model tag and the Ollama release are inputs with no default: they must
#     equal the Mac's, or the scores cannot be compared with its scores.
#
# A variant is only a candidate: `run_aq.py` says "kept" only when it is the same
# or better than "default" on EVERY measure with no new forbidden answer and no
# new figure the cited page lacks. Nothing here changes a default.

name: answer-quality-cpu

on:
  workflow_dispatch:
    inputs:
      ollama_version:
        description: "Ollama release to install (the Mac's), e.g. 0.40.6"
        required: true
        type: string
      model:
        description: "Model tag (the Mac's), e.g. qwen3.5:4b-q4_K_M"
        required: true
        type: string
      variants:
        description: "Prompt variants besides default, comma separated"
        required: false
        default: "quote_first,check_figures,cite_every_sentence"
        type: string
      limit:
        description: "Only the first N questions (0 = all 26)"
        required: false
        default: "12"
        type: string
      issue:
        description: "Issue to post the table on"
        required: true
        default: "692"
        type: string

permissions:
  contents: read

concurrency:
  group: answer-quality-cpu
  cancel-in-progress: false

jobs:
  score:
    name: ask, score and post
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      issues: write
    env:
      MODEL: ${{ inputs.model }}
      OLLAMA_VERSION: ${{ inputs.ollama_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The pf1-cpu workflow's environment, same key, so a hit skips the install.
      - name: Restore the Python environment
        id: venv
        uses: actions/cache@v6
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}-ruff0.16.6-split0.11.0

      - name: Install dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/python -m pip install --upgrade pip
          ~/venv/bin/pip install -r backend/requirements.txt
          ~/venv/bin/pip install huggingface_hub ruff==0.16.6 pytest-split==0.11.0

      - name: Use the environment
        run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Cache the embedding and reranker models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Stage the embedding and reranker models
        run: |
          python scripts/fetch_models.py
          python scripts/fetch_models.py --verify-only

      - name: Cache the answer model
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.ollama_version }}-${{ inputs.model }}

      - name: Install Ollama (the named release)
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh
          sudo systemctl disable --now ollama || true
          echo "OLLAMA_MODELS=$HOME/.ollama/models" >> "$GITHUB_ENV"
          ollama --version

      - name: Start Ollama and pull the model
        env:
          OLLAMA_FLASH_ATTENTION: "1"
          OLLAMA_KV_CACHE_TYPE: q8_0
          OLLAMA_MAX_LOADED_MODELS: "1"
          OLLAMA_KEEP_ALIVE: 30m
          OLLAMA_NUM_PARALLEL: "1"
        run: |
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version | grep -F "\"$OLLAMA_VERSION\"" \
            || { echo "the Ollama on 11434 is not version $OLLAMA_VERSION"; exit 1; }
          ollama pull "$MODEL"

      - name: Ask the invented questions with each variant
        env:
          PYTHONPATH: backend
          ANSWER_MODEL: ${{ inputs.model }}
          AUTH_MODE: disabled
          HEAVY_JOB_LOCK: "off"
          REASONING_PROVIDER: ollama
          STANDARDS_READER_ENABLED: "false"
          STANDARDS_READER_ALLOW_PUBLIC_EGRESS: "false"
          REVIEW_WEB_STANDARDS_ENABLED: "false"
          SMTP_ENABLED: "false"
          VARIANTS: ${{ inputs.variants }}
          LIMIT: ${{ inputs.limit }}
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
        run: |
          python eval/answer_quality/run_aq.py --model "$MODEL" --variants "$VARIANTS" \
            --limit "$LIMIT" --out aq.json

      - name: Post the table
        if: always()
        env:
          ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f aq.json ]; then
            python - <<'PY' > comment.md
          import json
          d = json.load(open("aq.json"))
          print("Answer quality on GitHub's CPU machines (invented questions only; scores count, timings do not).")
          print()
          print(d["report"])
          PY
            cat comment.md >> "$GITHUB_STEP_SUMMARY"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          else
            echo "no aq.json: the run made no score" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the server log (invented text only, safe to print)
        if: failure()
        run: tail -n 40 "$RUNNER_TEMP/ollama.log" || true

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: answer-quality
          path: aq.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Ollama
        if: always()
        run: pkill -f "ollama serve" || true
