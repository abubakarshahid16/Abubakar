# The backend suite on WINDOWS, run by GitHub so a person does not have to.
#
# Why this file exists. The owner runs this product on Windows; `tests.yml`
# runs on Linux only. Until now the only Windows check was a person running the
# suite by hand on their own PC - slow, and repeated for every package. It found
# real Windows-only problems (line endings written by a script, zip headers that
# differ by platform, a test that needs POSIX `fork`), so the check is worth
# having; it just belongs here, not in a manual step.
#
# What it is NOT. It is deliberately a separate file with its own job name and
# is NOT one of the checks `main` requires, so a Windows-only failure is visible
# in its run but cannot block a merge until the owner decides, after it
# has proved reliable, to make it required. It runs NIGHTLY on `main` and on
# demand (workflow_dispatch) - not on pull requests or pushes - to save Actions
# minutes (owner decision 2026-10-08, CI trim). A Windows-only failure is
# therefore seen within a day on main, or at once when started by hand.
#
# It runs the same suite the Linux job runs, with the same model staging and the
# same "is the suite armed" check. It does not run the lint, the benchmarks or
# the frontend: Linux covers those and their floors depend on the machine.
#
# Three shards (order 130). As one job the suite took about 20 of a train's 22
# minutes. It is now split three ways the way `tests.yml` splits it (pytest-split
# by measured duration, contiguous chunks, `-n auto`), and an aggregate job
# keeps the old check name, so what a train waits for has the same name. The
# aggregate proves every collected test ran in exactly one shard (#589). The
# nightly run on main stores Windows durations in their own cache
# (`windows-test-durations-`, a prefix the Linux restore never matches); until
# the first one, the shards split from the committed Linux file. Durations
# are stored on the nightly only: a train's dispatch runs on a train branch,
# whose cache no later run can read.

name: tests-windows

on:
  schedule:
    - cron: "41 2 * * *" # nightly, off the hour, on main by default
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-windows-shard:
    name: backend on Windows shard ${{ matrix.group }}/3
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install huggingface_hub pytest-split==0.11.0

      - name: Cache models
        id: models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: models-windows-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Stage models
        run: python scripts/fetch_models.py

      # Without the models most tests SKIP and a skipped suite reports success.
      - name: Confirm the models are staged
        run: python scripts/fetch_models.py --verify-only

      # The newest nightly Windows durations over the committed file; all three
      # shards restore the same one, and the aggregate's audit fails if a test
      # was dropped or run twice all the same.
      - name: Restore the latest Windows test durations
        uses: actions/cache/restore@v6
        with:
          path: backend/.test_durations
          key: windows-test-durations-${{ github.run_id }}
          restore-keys: windows-test-durations-
          # Saved by the aggregate on Linux: without this a Windows runner
          # never matches a cache written on another OS.
          enableCrossOsArchive: true

      - name: Run this shard of the suite
        working-directory: backend
        env:
          PYTHONPATH: ../scripts
          CI_TEST_IDS_OUT: ${{ github.workspace }}/test-ids/shard-${{ matrix.group }}.txt
          STORE_DURATIONS: ${{ github.event_name == 'schedule' && '--store-durations' || '' }}
        run: |
          mkdir -p ../test-ids
          python -m pytest -q -n auto -p ci_test_ids --splits 3 --group ${{ matrix.group }} --splitting-algorithm duration_based_chunks $STORE_DURATIONS --durations=10

      - name: Keep this shard's durations (nightly)
        if: github.event_name == 'schedule'
        run: cp backend/.test_durations test-ids/durations-${{ matrix.group }}.json

      # One full collection, same selection as the shards, for the audit.
      - name: Collect the whole suite once
        if: matrix.group == 1
        working-directory: backend
        env:
          PYTHONPATH: ../scripts
          CI_COLLECT_OUT: ${{ github.workspace }}/test-ids/full.txt
        run: python -m pytest --collect-only -q -p ci_test_ids > /dev/null

      - name: Upload this shard's test ids
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-ids-${{ matrix.group }}
          path: test-ids/
          if-no-files-found: error
          retention-days: 7

  # The old job's name, so the check a train waits for keeps its name.
  backend-windows:
    name: backend on Windows (pytest, informational)
    needs: [backend-windows-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # "= success", not "!= failure": a cancelled or skipped shard fails it too.
      - name: Every Windows shard passed
        run: |
          echo "shards: ${{ needs.backend-windows-shard.result }}"
          test "${{ needs.backend-windows-shard.result }}" = "success"

      - uses: actions/checkout@v7

      - name: Download the shards' test ids
        uses: actions/download-artifact@v8
        with:
          pattern: windows-test-ids-*
          path: test-ids
          merge-multiple: true

      - name: Every collected test ran in exactly one shard
        run: python3 scripts/ci_test_ids.py compare --full test-ids/full.txt test-ids/shard-1.txt test-ids/shard-2.txt test-ids/shard-3.txt

      - name: Merge the shards' durations (nightly)
        if: github.event_name == 'schedule'
        run: python3 scripts/ci_test_ids.py merge-durations --ids test-ids --out backend/.test_durations

      - name: Save the Windows durations for the next runs
        if: github.event_name == 'schedule'
        uses: actions/cache/save@v6
        with:
          path: backend/.test_durations
          key: windows-test-durations-${{ github.run_id }}
          enableCrossOsArchive: true
