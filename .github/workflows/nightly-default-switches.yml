# Lock 3 (#1626): the suite pins the switches turned on by default to off, because its tests were
# written for the off path. This job runs the suite on the code's real defaults and prints what fails.
# Not a merge gate: it runs on no pull request, and its failures do not fail the workflow.
name: nightly-default-switches

on:
  push:
    branches: [c1/lock3-switches-on]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  defaults-unpinned:
    name: backend on default switches (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install huggingface_hub

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Stage models
        run: python scripts/fetch_models.py

      - name: Run the suite with the Lock 3 pins lifted
        working-directory: backend
        env:
          RAG_TEST_LIFT_LOCK3_PINS: "1"
          HEAVY_JOB_LOCK: "off"
        run: python -m pytest -q -n auto -rf --tb=no
