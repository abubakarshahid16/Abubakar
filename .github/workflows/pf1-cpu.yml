# PF1 invented-sheet test set on GitHub's CPU machines (#881, order 171).
#
# Reviews every INVENTED TUNING sheet of `tests/data/pf1/` in parallel (one job
# per sheet) with the same local model as the Mac (Ollama, CPU only), then
# scores them with `scripts/pf1_report.py` and posts the counts on the tracking
# issue. Scores from CPU count; TIMINGS DO NOT (speed is measured on the Mac).
#
# Rules, enforced in code, not by this file's wording:
#   * `workflow_dispatch` only: started by hand or by the Mac test queue, never
#     on a push or a schedule.
#   * Invented tuning sheets only. `scripts/pf1_ci_guard.py` reads exactly
#     `tests/data/pf1/` and refuses the whole run when any sheet is held out,
#     is of the library group (it carries standard text) or names a file
#     outside that folder. No real document, no approved datasheet, ever.
#   * No secret is used: only the default token, and only to post the result
#     (`issues: write` on the last job alone). No Claude / API call.
#   * One PF1 run at a time (`concurrency`, never cancelled); 300 minutes max
#     per job; the model is cached between runs.
#   * The only downloads besides the repository's dependencies are the Ollama
#     release and the model weights, both named by the dispatcher's inputs.
#
# The two inputs with no default are the two things this file must not guess:
# which Ollama version the Mac runs. The Mac's other model settings (order 157)
# are in the `env:` of the server step; keep that block equal to the Mac's.

name: pf1-cpu

on:
  workflow_dispatch:
    inputs:
      ollama_version:
        description: "Ollama release to install (the Mac's), e.g. 0.12.3"
        required: true
        type: string
      model:
        description: "Model tag (the Mac's)"
        required: true
        default: "qwen3.5:4b"
        type: string
      sheets:
        description: "Sheet ids, comma separated; empty = every tuning sheet"
        required: false
        default: ""
        type: string
      issue:
        description: "Issue to post the counts on"
        required: true
        default: "881"
        type: string

permissions:
  contents: read

concurrency:
  group: pf1-cpu
  cancel-in-progress: false

jobs:
  plan:
    name: which sheets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.guard.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ask the guard which sheets may run
        id: guard
        env:
          SHEETS: ${{ inputs.sheets }}
        run: |
          only=()
          IFS=',' read -ra ids <<< "$SHEETS"
          for id in "${ids[@]}"; do
            id="${id// /}"
            if [ -n "$id" ]; then only+=(--only "$id"); fi
          done
          matrix="$(python3 scripts/pf1_ci_guard.py plan "${only[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  review:
    name: review ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHEET: ${{ matrix.id }}
      MODEL: ${{ inputs.model }}
      OLLAMA_VERSION: ${{ inputs.ollama_version }}
      WORK: ${{ github.workspace }}/pf1-work
    steps:
      - name: Note when the job started
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The test workflow's environment, same key, so a hit skips the install.
      - name: Restore the Python environment
        id: venv
        uses: actions/cache@v6
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}-ruff0.16.6-split0.11.0

      - name: Install dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/python -m pip install --upgrade pip
          ~/venv/bin/pip install -r backend/requirements.txt
          ~/venv/bin/pip install huggingface_hub ruff==0.16.6 pytest-split==0.11.0

      - name: Use the environment
        run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Cache the embedding and reranker models
        uses: actions/cache@v6
        with:
          path: backend/models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Stage the embedding and reranker models
        run: |
          python scripts/fetch_models.py
          python scripts/fetch_models.py --verify-only

      - name: Cache the answer model
        id: weights
        uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: ollama-${{ inputs.ollama_version }}-${{ inputs.model }}

      - name: Install Ollama (the named release)
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh
          ollama --version

      - name: Start Ollama and pull the model
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then break; fi
            sleep 2
          done
          ollama pull "$MODEL"

      # A fresh server on a fresh database that is NOT live-shaped, so the
      # runner's own checks (a named copy, not the live ports) hold here too.
      # Keep this env equal to the Mac's test server (order 157).
      - name: Start the backend on a fresh test database
        env:
          DATA_DIR: ${{ github.workspace }}/pf1-work/data
          UPLOAD_DIR: ${{ github.workspace }}/pf1-work/data/uploads
          DB_PATH: ${{ github.workspace }}/pf1-work/pf1.sqlite
          WATCH_FOLDER: ""
          AUTH_MODE: disabled
          PORT: "18080"
          HEAVY_JOB_LOCK: "off"
          ANSWER_MODEL: ${{ inputs.model }}
          MATCH_TIMEOUT_SECONDS: "120"
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
        run: |
          mkdir -p "$WORK/data/uploads" "$WORK/runs"
          cd backend
          nohup python run.py > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/api/health | grep -q '"ok":true'; then exit 0; fi
            sleep 2
          done
          tail -n 40 "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Review the sheet
        run: |
          python scripts/pf1_run.py --set tests/data/pf1 --out "$WORK/runs" \
            --server http://127.0.0.1:18080 --test-server --no-login \
            --db-copy "$WORK/pf1.sqlite" --only "$SHEET" --timeout 16000

      - name: Export the findings from a copy of the database
        run: |
          python - <<'PY'
          import json, os, sqlite3
          work, sheet = os.environ["WORK"], os.environ["SHEET"]
          run_id = json.load(open(f"{work}/runs/{sheet}.run.json"))["review_run_id"]
          if not run_id:
              raise SystemExit("the sheet has no review run: nothing to export")
          src = sqlite3.connect(f"file:{work}/pf1.sqlite?mode=ro", uri=True)
          dst = sqlite3.connect(f"{work}/pf1-copy.sqlite")
          src.backup(dst)
          dst.close()
          open(f"{work}/run_id", "w").write(run_id)
          PY
          python scripts/review_score.py export --db "$WORK/pf1-copy.sqlite" \
            --run "$(cat "$WORK/run_id")" --out "$WORK/runs/$SHEET.findings.json" --model "$MODEL"

      - name: Say what it cost
        if: always()
        run: |
          echo "sheet $SHEET - about $((($(date +%s) - STARTED) / 60)) minutes of runner time" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the run record and the findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pf1-${{ matrix.id }}
          path: |
            pf1-work/runs/${{ matrix.id }}.run.json
            pf1-work/runs/${{ matrix.id }}.findings.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop the servers
        if: always()
        run: |
          pkill -f "python run.py" || true
          pkill -f "ollama serve" || true

  score:
    name: score and post the counts
    needs: [plan, review]
    # Not when the guard refused: there is nothing to score then.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the runs
        uses: actions/download-artifact@v8
        with:
          pattern: pf1-*
          path: runs
          merge-multiple: true

      - name: Score them
        env:
          ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--check` exits 1 on any false Meets (the hard rule is 0): post the
          # counts first, then fail the job.
          set +e
          python scripts/pf1_report.py --set tests/data/pf1 --runs runs \
            --json report.json --check > report.md
          status=$?
          set -e
          {
            echo "PF1 on GitHub's CPU machines (invented tuning sheets only; scores count, timings do not)."
            echo
            cat report.md
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          exit "$status"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pf1-report
          path: |
            report.json
            report.md
          if-no-files-found: warn
          retention-days: 30
