# Secret scanning - COMPENSATING CONTROL for the absence of GitHub Advanced
# Security on this account tier. See ADR-0004.
#
# All actions are pinned to full commit SHAs per EXECUTION.md section 9.
# The gitleaks binary is pinned by version AND verified by SHA-256 checksum,
# which is stronger than pinning a wrapper action.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. This workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret introduced in an earlier commit of this
          # branch must fail even if the tip no longer contains it.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git . --redact --no-banner --verbose

      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner --verbose

  no-client-data:
    name: no-client-data guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if forbidden file types are tracked
        run: |
          set -uo pipefail
          # EXECUTION.md section 6: client PDFs, extracted text, embeddings,
          # chat history, model weights and databases must never be in Git.
          # Synthetic CI fixtures are the single documented exception.
          violations=$(git ls-files \
            | grep -E '\.(pdf|onnx|gguf|safetensors|bin|sqlite|sqlite3|db|db-wal|db-shm|lance)$' \
            | grep -v '^tests/fixtures/synthetic/' \
            || true)

          if [ -n "$violations" ]; then
            echo "::error::Forbidden file types are tracked in Git:"
            echo "$violations" | sed 's/^/  /'
            echo ""
            echo "Client documents, extracted text, embeddings, model weights and"
            echo "databases must never enter this repository. See EXECUTION.md s6."
            exit 1
          fi
          echo "OK: no forbidden file types tracked."

      - name: Fail if a .env file is tracked
        run: |
          set -uo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::A .env file is tracked: $tracked"
            exit 1
          fi
          echo "OK: no .env tracked."
