name: Claude Code

# Runs only when the repository owner writes "@claude" in a comment (order
# 163.7). Nothing here runs on pull_request, push, issue creation or a
# schedule: an automatic review of every PR would use up the weekly allowance.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per pull request or issue; a newer comment replaces a running one.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Caps the length of one run.
          claude_args: '--max-turns 10'
