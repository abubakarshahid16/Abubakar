# gitleaks configuration for the RAG Intelligence System repository
#
# This is a COMPENSATING CONTROL. GitHub Advanced Security secret scanning is
# unavailable on this account tier (HTTP 422). See ADR-0004.
#
# Unlike GHAS, this runs BOTH locally as a pre-commit hook (blocking a secret
# before it ever reaches GitHub) and in CI on every pull request.

title = "rag-intelligence secret scan"

[extend]
useDefault = true

# `[[allowlists]]`, not the deprecated `[allowlist]`: gitleaks refuses to load
# the two forms together, and the .env.example entry below needs the new one.
# Within one entry, paths and regexes are OR'd (condition defaults to OR),
# which is exactly how the old `[allowlist]` table behaved.
[[allowlists]]
description = "Paths and values that are safe by construction"

paths = [
  '''\.gitleaks\.toml$''',
  # NOT `.env.example` as a whole file any more (audit 2026-09-30): a real
  # key pasted into the example was invisible to the scanner. Its empty
  # placeholder lines are allowed by the [[allowlists]] entry below instead.
  '''(^|/)package-lock\.json$''',
  '''(^|/)uv\.lock$''',
  '''(^|/)tests/fixtures/synthetic/''',
]

regexes = [
  # Documented placeholders only. Never add a real value here.
  '''EXAMPLE_[A-Z0-9_]+''',
  '''<[a-z-]+>''',
  '''your-[a-z-]+-here''',
  '''CHANGE_ME''',
  # Made-up datasheet benchmark file names (ds01_name.pdf ...). Shape only: never add a real value here.
  '''^ds[0-9]{2}_[a-z0-9_]+\.(pdf|xlsx|docx)$''',
]

# The documented EMPTY placeholders in backend/.env.example, and only those:
# path AND line must both match. `KEY=` with nothing after it is not a secret;
# `KEY=<anything>` in the example is scanned like every other file.
[[allowlists]]
description = "empty placeholder lines in .env.example"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)\.env\.example$''']
regexes = [
  '''^\s*#?\s*[A-Z][A-Z0-9_]*(KEY|SECRET|PASSWORD|TOKEN)[A-Z0-9_]*=\s*$''',
]
