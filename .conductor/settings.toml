"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Conductor (Mac app that runs several Claude Code agents at once, each in
# its own git worktree). One workspace = one task = one branch = one PR.
#
# Setup installs the backend and screen packages INSIDE the workspace.
# It never copies backend/.env (keys and the Claude spend switch stay in
# the live app only) and never touches the live database: a workspace's
# backend/data is its own, empty folder (see CLAUDE.md, "Only the server
# writes the live DB").

[scripts]
setup = "bash scripts/conductor/setup.sh"
archive = "bash scripts/conductor/archive.sh"
run_mode = "concurrent"

# Preview this workspace's screens against the LIVE app's server (port
# 8000), on the workspace's own port, so the owner can click through a
# change before it merges while the live app keeps running.
[scripts.run.screens]
command = "bash scripts/conductor/run-screens.sh"
default = true
icon = "monitor"
available_in = "local"

# The related tests only (the full suite runs on GitHub).
[scripts.run.tests]
command = "bash scripts/conductor/test-changed.sh"
icon = "flask-conical"
available_in = "local"
